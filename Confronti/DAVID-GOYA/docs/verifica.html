<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica David e Goya</title><style>body{margin:20px;background:#ece8df;color:#222;font:16px system-ui}button,select{font:inherit;padding:12px;margin:5px}iframe{display:block;border:1px solid #333;background:#171816;max-width:100%;height:844px}pre{white-space:pre-wrap}nav{margin-bottom:12px}</style><link rel="stylesheet" href="../../../pwa-common/gbprof-accessibility.css?v=1"></head><body><h1>Banco di verifica della lezione</h1><p>Pagina tecnica separata dal percorso degli studenti. La larghezza dell’iframe prova il layout responsive; i gesti sintetici non sostituiscono un dispositivo fisico.</p><nav><label for="viewport">Viewport</label><select id="viewport"><option value="390">Smartphone 390 px</option><option value="768">Tablet 768 px</option><option value="1180">Desktop 1180 px</option></select><button id="check">Verifica layout e cache</button><button id="gestures">Prova pan e pinch sintetici</button><button id="lesson">Vai alla lezione</button><button id="videos">Vai ai video</button><button id="activity">Vai al laboratorio</button></nav><pre id="result" role="status">Pronto.</pre><iframe id="preview" title="Laboratorio nel viewport di prova" src="../index.html" width="390"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#result');document.querySelector('#viewport').onchange=e=>frame.style.width=e.target.value+'px';
document.querySelector('#lesson').onclick=()=>frame.contentDocument.querySelector('#lezione').scrollIntoView();document.querySelector('#videos').onclick=()=>frame.contentDocument.querySelector('#video-1').scrollIntoView();
document.querySelector('#activity').onclick=()=>{frame.contentDocument.querySelector('#laboratorio').scrollIntoView();};
document.querySelector('#check').onclick=async()=>{const doc=frame.contentDocument;const imgs=[...doc.querySelectorAll('img')];const cache=await caches.open('gbprof-david-goya-v2-lesson');const keys=await cache.keys();const expected=['index.html','app.js','content.js','videos.js','styles.css','assets/images/david.jpg','assets/images/goya.jpg'];const missing=[];for(const p of expected)if(!(await cache.match(new URL('../'+p,location.href))))missing.push(p);out.textContent=JSON.stringify({lessonVisible:!!doc.querySelector('#lezione')&&getComputedStyle(doc.querySelector('#lezione')).display!=='none',lessonChapters:doc.querySelectorAll('.lesson-text>section').length,fullVideos:[...doc.querySelectorAll('.lesson-video video')].map(v=>({id:v.id,src:v.querySelector('source').getAttribute('src'),controls:v.controls,paused:v.paused,time:v.currentTime,duration:v.duration,error:v.error?.message||null})),synthesisVisible:!doc.querySelector('#theory').hidden,viewport:doc.documentElement.clientWidth,bodyWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth,images:imgs.map(i=>({file:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),cacheEntries:keys.length,missingOfflineCore:missing,controller:!!frame.contentWindow.navigator.serviceWorker.controller},null,2);};
document.querySelector('#gestures').onclick=()=>{const doc=frame.contentDocument;doc.querySelector('#focus-pair').click();const stage=doc.querySelector('.viewer:not(.mobile-hidden) .stage')||doc.querySelector('.stage');const scene=stage.querySelector('.scene');let before=scene.style.transform;const w=frame.contentWindow;const r=stage.getBoundingClientRect();function send(type,id,x,y){stage.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:r.x+x,clientY:r.y+y,bubbles:true}));}const original=stage.setPointerCapture.bind(stage);stage.setPointerCapture=()=>{};try{send('pointerdown',91,100,100);send('pointermove',91,125,135);send('pointerup',91,125,135);const pan=scene.style.transform;send('pointerdown',92,100,100);send('pointerdown',93,160,100);send('pointermove',93,220,100);send('pointerup',92,100,100);send('pointerup',93,220,100);out.textContent=JSON.stringify({before,afterPan:pan,afterPinch:scene.style.transform,panChanged:before!==pan,pinchChanged:pan!==scene.style.transform,note:'Pointer events sintetici; pointer capture reale da verificare su dispositivo.'},null,2);}finally{stage.setPointerCapture=original;}};
</script><script src="../../../pwa-common/gbprof-accessibility.js?v=1"></script></body></html>
